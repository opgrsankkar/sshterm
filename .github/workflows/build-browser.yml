name: Build browser app

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Create release archive
        run: tar -czf sshterm-browser.tar.gz dist package.json package-lock.json README.md LICENSE.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sshterm-browser
          path: sshterm-browser.tar.gz
          if-no-files-found: error

      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: sshterm-browser.tar.gz
